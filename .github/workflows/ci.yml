name: CI

# Public repo — Actions minutes are free, so this runs on every push and PR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.8.4

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Imports resolve
        # python-telegram-bot and FastAPI both fail at import time on a version
        # mismatch, so this catches a bad pin before anyone wires a webhook.
        run: python -c "from majsq_bot import agent, render, handlers, app; print('ok')"

      - name: The webhook refuses an unsigned update
        # The single most important behaviour in this repo: a webhook URL is
        # public, so the secret header is the only thing between Telegram and
        # anyone who guesses it.
        #
        # Deliberately runs with NO bot token. python-telegram-bot validates a
        # token against Telegram's servers during Application.initialize(), so
        # a fake token turns this into a network test of someone else's API —
        # which is exactly the kind of flake that teaches people to ignore CI.
        # Unconfigured is enough: the secret gate runs before the configuration
        # check, which is the property being asserted.
        env:
          TELEGRAM_WEBHOOK_SECRET: "ci-secret"
        run: |
          pip install httpx
          python - <<'PY'
          from fastapi.testclient import TestClient
          from majsq_bot.app import _already_handled, app

          with TestClient(app) as client:
              assert client.get("/healthz").status_code == 200

              bad = client.post("/tg/webhook/", json={"update_id": 1})
              assert bad.status_code == 403, f"unsigned update was accepted: {bad.status_code}"

              # Signed but unconfigured: 503, NOT 403. Proves the secret gate
              # ran first and the request got past it.
              ok = client.post(
                  "/tg/webhook/",
                  json={"update_id": 2},
                  headers={"X-Telegram-Bot-Api-Secret-Token": "ci-secret"},
              )
              assert ok.status_code == 503, f"expected 503 when unconfigured, got {ok.status_code}"

          # Telegram retries on any non-2xx, and a retry must never post a
          # second set of picks to the group.
          assert _already_handled(99) is False
          assert _already_handled(99) is True
          print("  secret checked before configuration, update_id de-duplicated")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: majsq-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
